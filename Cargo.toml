[package]
name = "auxide-midi"
version = "0.1.2"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "MIDI input and polyphonic synthesizer integration for Auxide DSP graphs"
keywords = ["midi", "synthesizer", "polyphonic", "real-time", "dsp"]
categories = ["multimedia::audio", "api-bindings"]
repository = "https://github.com/Michael-A-Kuykendall/auxide-midi"

[features]
default = []

[dependencies]
auxide = { path = "../auxide" }
auxide-dsp = { path = "../auxide-dsp" }
auxide-io = { path = "../auxide-io" }
midir = "0.9"
crossbeam-channel = "0.5"
ctrlc = "3.4"
anyhow = "1.0"

[dev-dependencies]
proptest = "1.0"
hound = "3.5.1"

[[example]]
name = "list_devices"

[[example]]
name = "note_echo"

[[example]]
name = "poly_synth"

[[example]]
name = "rompler_demo"

[[example]]
name = "melody_demo"